{
    "metadata": {
        "name": "Project Manager",
        "version": "0.0.1a",
        "repo": "https://github.com/LordPorkchop/Project-Manager"
    },
    "logMode": {
        "currentValue": "both",
        "defaultValue": "file",
        "type": "literal",
        "possibleValues": ["both", "file", "console"],
        "permissions": {
            "read": {
                "user": true,
                "app": true
            },
            "write": {
                "user": true,
                "app": true
            }
        },
        "metadata": {
            "category": "advanced/logging",
            "displayName": "Logging Mode",
            "description": "Whether logs are printed in the terminal, saved to a file, or both",
            "applicationRestartRequired": true
        }
    },
    "logLevel": {
        "currentValue": "debug",
        "defaultValue": "info",
        "type": "literal",
        "possibleValues": ["debug", "info", "warning", "error", "exception"],
        "permissions": {
            "read": {
                "app": true,
                "user": true
            },
            "write": {
                "app": true,
                "user": true
            }
        },
        "metadata": {
            "category": "advanced/logging",
            "displayName": "Logger Level",
            "description": "Logs of which priority and higher are emitted",
            "applicationRestartRequired": true
        }
    },
    "logFilePath": {
        "currentValue": "./src/logs",
        "defaultValue": "./src/logs",
        "type": "str",
        "permissions": {
            "read": {
                "app": true,
                "user": true
            },
            "write": {
                "app": true,
                "user": true
            }
        },
        "metadata": {
            "category": "advanced/logging",
            "displayName": "Log File Location",
            "description": "Where log files are saved. Only applicable if Logging Mode is set to b&file& or b&both&",
            "applicationRestartRequired": true
        }
    }
}